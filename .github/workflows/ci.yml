name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format · lint · typecheck · test · build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The sandbox integration tests need bubblewrap + socat. Ubuntu 24.04 restricts unprivileged
      # user namespaces; allow them for bwrap only (ADR-018), never via the global sysctl.
      - name: Sandbox prerequisites (bubblewrap, socat, bwrap-scoped AppArmor profile)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n  include if exists <local/bwrap>\n}\n' | sudo tee /etc/apparmor.d/bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --unshare-user --unshare-net --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev true && echo "bwrap ok"

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Upstream boundaries and tracked-secret guard
        run: pnpm check:boundaries

      - name: Typecheck
        run: pnpm typecheck

      # The pinned DSH runtime (ADR-030) for the real-runtime tests; no credentials, no paid calls.
      - name: Install pinned DSH runtime
        shell: bash
        run: |
          entry="$(node scripts/install-dsh-runtime.mjs "${{ runner.temp }}/dsh-runtime" | tail -n 1)"
          echo "NEXAR_DSH_ENTRY=${entry}" >> "$GITHUB_ENV"

      - name: Test (offline; live tests are skipped without NEXAR_LIVE_TESTS)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: CLI smoke (offline echo resource, no credentials)
        run: |
          node apps/cli/dist/main.js resources
          node apps/cli/dist/main.js run --kind general "ci smoke"

      # Nexar Desktop (ADR-021): drives the real Electron app with Playwright on a virtual display.
      # Offline: only the echo resource is used. --no-sandbox is passed by the test, not the app.
      - name: Desktop E2E (Electron under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm desktop:e2e

      - name: Desktop E2E (native Windows, offline echo)
        if: runner.os == 'Windows'
        run: pnpm desktop:e2e

      - name: Package Windows desktop (unsigned per-user installer)
        if: runner.os == 'Windows'
        run: pnpm desktop:package:win

      - name: Packaged desktop E2E (native Windows, offline echo)
        if: runner.os == 'Windows'
        env:
          NEXAR_DESKTOP_EXECUTABLE: ${{ github.workspace }}\release\desktop\win-unpacked\Nexar.exe
        run: pnpm desktop:e2e

      - name: Upload Windows installer and SHA256
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Nexar-Windows-x64-${{ github.sha }}
          if-no-files-found: error
          path: |
            release/desktop/*.exe
            release/desktop/*.sha256

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        # Pinned CLI release, run directly: no third-party action, no token required.
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
