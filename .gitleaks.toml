title = "Nexar secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Synthetic API credentials in the original connection-manager regression fixtures"
condition = "AND"
paths = ['''^apps/desktop/src/main/connection-manager\.test\.ts$''']
regexTarget = "secret"
regexes = [
  '''^sk-test-valid-length-key-1234$''',
  '''^gsk-groq-test-secret-key-1234$''',
  '''^mis-mistral-test-secret-key-1234$''',
  '''^xai-test-key-rotated-5678$''',
]

[[rules.allowlists]]
description = "Synthetic credential in the connection-consent regression fixture"
condition = "AND"
paths = ['''^apps/desktop/src/main/connection-consent\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^synthetic-consent-key-123456789$''']

[[rules.allowlists]]
description = "Conversation idempotency sentinel in the provider preservation test"
condition = "AND"
paths = ['''^apps/desktop/src/main/providers\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^preserved_submission_1$''']

[[rules.allowlists]]
description = "Fake bridge token fixture in the loopback translator tests"
condition = "AND"
paths = ['''^apps/desktop/src/control-gateway/server\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^tok-0123456789abcdef$''']

[[rules.allowlists]]
description = "Synthetic test secrets in local CI test suite"
condition = "AND"
paths = ['''^tests/local-ci\.test\.ts$''']
regexTarget = "secret"
regexes = [
  '''^ghp_ABC1234567890defABC1234567890def123$''',
  '''^sk-abcdef1234567890123456$''',
]

